spring:
  task:
    execution:
      mode: force        # keep Boot's applicationTaskExecutor next to outboxExecutor
    scheduling:
      pool:
        size: 4          # default is 1: cleanup would block polling
      shutdown:
        await-termination: true
        await-termination-period: 15s
  lifecycle:
    timeout-per-shutdown-phase: 15s   # 15 + 15 + 15 must fit terminationGracePeriodSeconds (60)
  application:
    name: demo
  datasource:
    url: jdbc:postgresql://localhost:5434/mydatabase?stringtype=unspecified
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: outbox-demo
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
